name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build Docker image
        run: docker build -t ticket-platform:ci .

      - name: Start container
        run: docker run -d --name ticket-api -p 3000:3000 ticket-platform:ci

      - name: Wait for the app
        run: |
          for i in $(seq 1 20); do
            curl -sf localhost:3000/health && exit 0
            sleep 1
          done
          echo "App did not start"
          exit 1

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Show container logs
        if: always()
        run: docker logs ticket-api
